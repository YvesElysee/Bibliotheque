<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — Bibliothèque de la Congrégation</title>
  <link rel="stylesheet" href="../css/output.css" />
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">

  <div class="fixed inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-0 right-1/3 w-96 h-96 rounded-full opacity-20"
         style="background: radial-gradient(ellipse, #4F46E5 0%, transparent 70%); filter: blur(60px);"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex flex-col items-center gap-3">
        <div class="w-14 h-14 rounded-2xl bg-primary-600 flex items-center justify-center glow-primary">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </div>
        <div>
          <h1 class="font-serif text-2xl font-bold text-white">Bibliothèque</h1>
          <p class="text-sm text-slate-500">de la Congrégation</p>
        </div>
      </a>
    </div>

    <div class="card glass p-8">
      <h2 class="font-serif text-xl font-semibold text-white mb-6 text-center">Créer un compte</h2>

      <div id="register-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-sm text-red-400"></div>
      <div id="register-success" class="hidden mb-4 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-sm text-emerald-300">
        <p class="font-medium mb-1">✅ Compte créé avec succès !</p>
        <p id="register-success-text">Vous pouvez maintenant vous connecter avec vos identifiants.</p>
        <a href="login.html" class="inline-block mt-3 btn-success btn-sm">Aller à la connexion</a>
      </div>

      <form id="register-form" novalidate>
        <div class="grid grid-cols-2 gap-4">
          <div class="form-group mb-0">
            <label class="form-label" for="firstName">Prénom</label>
            <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Jean" autocomplete="given-name" required />
            <span class="form-error hidden" id="firstName-error"></span>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="lastName">Nom</label>
            <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Dupont" autocomplete="family-name" required />
            <span class="form-error hidden" id="lastName-error"></span>
          </div>
        </div>
        <div class="mb-4"></div>

        <div class="form-group">
          <label class="form-label" for="email">Adresse email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="jean.dupont@exemple.com"
            autocomplete="email" required />
          <span class="form-error hidden" id="email-error"></span>
          <p class="text-xs text-slate-500 mt-1">Vous recevrez les notifications d'emprunt sur cet email.</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="relative">
            <input type="password" id="password" name="password" class="form-input pr-12"
              placeholder="Minimum 8 caractères" autocomplete="new-password" required />
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1" aria-label="Afficher">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <!-- Indicateur de force du mot de passe -->
          <div class="mt-2 grid grid-cols-4 gap-1">
            <div class="h-1 rounded-full bg-slate-700" id="strength-1"></div>
            <div class="h-1 rounded-full bg-slate-700" id="strength-2"></div>
            <div class="h-1 rounded-full bg-slate-700" id="strength-3"></div>
            <div class="h-1 rounded-full bg-slate-700" id="strength-4"></div>
          </div>
          <span class="form-error hidden" id="password-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="language">Langue préférée</label>
          <select id="language" name="preferredLanguage" class="form-select">
            <option value="FR">Français</option>
            <option value="EN">English</option>
          </select>
        </div>

        <button type="submit" id="register-btn" class="btn-primary w-full mt-2 py-3 text-base">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
          <span id="register-btn-text">Créer mon compte</span>
        </button>
      </form>

      <div class="divider"></div>
      <p class="text-center text-sm text-slate-500">
        Déjà membre ?
        <a href="login.html" class="text-primary-400 hover:text-primary-300 font-medium transition-colors ml-1">Se connecter</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/pages/register.js"></script>
  <div id="site-footer" class="w-full"></div>
  <script type="module" src="../js/components/footer.js"></script>
</body>
</html>
