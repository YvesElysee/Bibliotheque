<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe — Bibliothèque de la Congrégation</title>
  <link rel="stylesheet" href="../css/output.css" />
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">

  <div class="fixed inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-0 left-1/4 w-96 h-96 rounded-full opacity-20"
         style="background: radial-gradient(ellipse, #4F46E5 0%, transparent 70%); filter: blur(60px);"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="font-serif text-2xl font-bold text-white">Bibliothèque</h1>
      <p class="text-sm text-slate-500">de la Congrégation</p>
    </div>

    <div class="card glass p-8">
      <h2 class="font-serif text-xl font-semibold text-white mb-6 text-center">Définir un nouveau mot de passe</h2>

      <div id="reset-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-sm text-red-400"></div>
      <div id="reset-info" class="hidden mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-sm text-emerald-400"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">Nouveau mot de passe</label>
          <div class="relative">
            <input type="password" id="password" name="password" class="form-input pr-12" placeholder="Minimum 8 caractères" autocomplete="new-password" required />
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1" aria-label="Afficher">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirmer le mot de passe</label>
          <input type="password" id="confirm" name="confirm" class="form-input" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <button type="submit" id="reset-btn" class="btn-primary w-full mt-2 py-3 text-base">
          <span id="reset-btn-text">Réinitialiser</span>
        </button>
      </form>

      <div class="divider"></div>
      <p class="text-center text-sm text-slate-500">
        <a href="login.html" class="text-primary-400 hover:text-primary-300 font-medium transition-colors">Retour à la connexion</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/pages/reset-password.js"></script>
  <div id="site-footer" class="w-full"></div>
  <script type="module" src="../js/components/footer.js"></script>
</body>
</html>
