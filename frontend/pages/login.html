<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Bibliothèque Scolasticat Père Piariste</title>
  <link rel="stylesheet" href="../css/output.css" />
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
</head>
<body class="min-h-screen flex flex-col px-4 py-12">

  <!-- Fond décoratif -->
  <div class="fixed inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-0 left-1/4 w-96 h-96 rounded-full opacity-20"
         style="background: radial-gradient(ellipse, #4F46E5 0%, transparent 70%); filter: blur(60px);"></div>
    <div class="absolute bottom-0 right-1/4 w-80 h-80 rounded-full opacity-15"
         style="background: radial-gradient(ellipse, #6366F1 0%, transparent 70%); filter: blur(50px);"></div>
  </div>

  <div class="relative w-full max-w-md mx-auto my-auto">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex flex-col items-center gap-3">
        <div class="w-14 h-14 rounded-2xl bg-primary-600 flex items-center justify-center glow-primary">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </div>
        <div>
          <h1 class="font-serif text-2xl font-bold text-white">Bibliothèque</h1>
          <p class="text-sm text-slate-500">Scolasticat Père Piariste</p>
        </div>
      </a>
    </div>

    <!-- Carte de connexion -->
    <div class="card glass p-8">
      <h2 class="font-serif text-xl font-semibold text-white mb-6 text-center">Connexion</h2>

      <!-- Message d'erreur global -->
      <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-sm text-red-400"></div>

      <!-- Message info (ex: email vérifié) -->
      <div id="login-info" class="hidden mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-sm text-emerald-400"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Adresse email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="jean@exemple.com"
            autocomplete="email" required />
          <span class="form-error hidden" id="email-error"></span>
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between">
            <label class="form-label" for="password">Mot de passe</label>
            <a href="forgot-password.html" class="text-xs text-primary-400 hover:text-primary-300 transition-colors">
              Mot de passe oublié ?
            </a>
          </div>
          <div class="relative">
            <input type="password" id="password" name="password" class="form-input pr-12"
              placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors p-1" aria-label="Afficher le mot de passe">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <span class="form-error hidden" id="password-error"></span>
        </div>

        <button type="submit" id="login-btn" class="btn-primary w-full mt-2 py-3 text-base">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          <span id="login-btn-text">Se connecter</span>
        </button>
      </form>

      <div class="divider"></div>

      <p class="text-center text-sm text-slate-500">
        Pas encore de compte ?
        <a href="register.html" class="text-primary-400 hover:text-primary-300 font-medium transition-colors ml-1">
          S'inscrire
        </a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/pages/login.js"></script>
  <div id="site-footer" class="w-full"></div>
  <script type="module" src="../js/components/footer.js"></script>
</body>
</html>
