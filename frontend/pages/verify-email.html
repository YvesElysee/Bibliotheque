<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification de l'email — Bibliothèque Scolasticat Père Piariste</title>
  <link rel="stylesheet" href="../css/output.css" />
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
  <script type="module" src="../js/core/theme.js"></script>
</head>
<body class="min-h-screen flex flex-col px-4 py-12">

  <div class="relative w-full max-w-md mx-auto my-auto">
    <div class="text-center mb-8">
      <h1 class="font-serif text-2xl font-bold text-white">Bibliothèque</h1>
      <p class="text-sm text-slate-500">Scolasticat Père Piariste</p>
    </div>

    <div class="card glass p-8 text-center">
      <div id="verify-loading">
        <div class="inline-block animate-spin text-3xl mb-3">⟳</div>
        <p class="text-sm text-slate-400">Vérification de votre adresse email…</p>
      </div>
      <div id="verify-result" class="hidden">
        <p id="verify-icon" class="text-4xl mb-3"></p>
        <p id="verify-message" class="text-sm"></p>
        <a href="login.html" class="btn-primary w-full mt-6 py-3 text-base inline-flex justify-center">Aller à la connexion</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/pages/verify-email.js"></script>
  <div id="site-footer" class="w-full"></div>
  <script type="module" src="../js/components/footer.js"></script>
</body>
</html>
